[package]
name = "video-scout-desktop"
version = "0.1.0"
description = "Cross-platform media request inspector and downloader"
authors = ["Video Scout"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "video_scout_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-toml"] }

[dependencies]
tauri = { version = "2", features = ["config-toml"] }
chromiumoxide = { version = "0.9.1", features = ["fetcher", "rustls", "zip8"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
futures-util = "0.3"
url = "2"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
regex = "1"
