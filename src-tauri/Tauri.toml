productName = "Video Scout"
version = "0.1.0"
identifier = "com.videoscout.desktop"

[build]
beforeDevCommand = "npm run frontend:dev"
devUrl = "http://127.0.0.1:1420"
beforeBuildCommand = "npm run build:web"
frontendDist = "../dist"

[[app.windows]]
label = "main"
title = "Video Scout"
width = 1280
height = 860
minWidth = 960
minHeight = 680
resizable = true

[app.security]
csp = "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src ipc: http://ipc.localhost https: http:;"

[bundle]
active = false
targets = "all"
icon = []
category = "Utility"
shortDescription = "Detect and download page video streams"
longDescription = "Inspect media requests from a URL and download direct media or supported HLS streams."
